[project]
name = "leychile"
version = "0.1.0"
description = "Construye la historia git de la legislación chilena a partir de los servicios públicos de LeyChile (BCN)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leychile"]
