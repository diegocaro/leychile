[project]
name = "leyeschile"
version = "0.1.0"
description = "Build a git history of Chilean law from BCN LeyChile's public data services"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "tenacity>=8.2",
]

[tool.setuptools.packages.find]
where = ["src"]
